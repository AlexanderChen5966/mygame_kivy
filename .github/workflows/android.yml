name: Build Kivy APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip openjdk-17-jdk unzip git zip \
          libtool libffi-dev libssl-dev autoconf automake cmake \
          pkg-config zlib1g-dev libncurses5 libncurses5-dev libncursesw5 libstdc++6

    - name: Install Buildozer and Python dependencies
      run: |
        pip install --upgrade pip
        pip install cython
        pip install buildozer

    - name: Initialize Buildozer (first-time config)
      run: buildozer android clean

    - name: Build APK
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: myzombieapp-apk
        path: bin/*.apk
